# Release (U00-60): SLSA Build L2 — signed-tag build, SBOM, licence gate, provenance.
# Rules (impl 00 §3.8): third-party actions pinned by commit SHA, read-only default token,
# checkout without persisted credentials, untrusted values only through env, hosted runners only.
# T00-15b: build stages exactly the impl 10 U10-86 release bundle in bundle/; publish attaches
# it as one zip asset, next to the attested sdist (outside the bundle).
name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"
  HERNESS_ENV: test

defaults:
  run:
    shell: bash

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # Requirements, SBOM and DuckDB extension are those of the windows_amd64 target (U10-86).
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # pragma: allowlist secret
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0  # pragma: allowlist secret
        with:
          version: "0.11.8"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras
      - name: verify the tag is a verified, annotated tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          obj_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')
          if [ "$obj_type" != "tag" ]; then
            msg="tag $TAG is not an annotated tag"
            echo "$msg" >&2
            exit 1
          fi
          obj_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.verification.verified')
          if [ "$verified" != "true" ]; then
            msg="tag $TAG signature is not verified"
            echo "$msg" >&2
            exit 1
          fi
      - name: check the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            msg="tag $TAG does not match project version v$version"
            echo "$msg" >&2
            exit 1
          fi
      - run: uv build --wheel --out-dir bundle
      - run: uv build --sdist --out-dir sdist
      - name: runtime environment for the SBOM (Windows target)
        env:
          UV_PROJECT_ENVIRONMENT: build/runtime-venv
        run: uv sync --no-dev --all-extras --no-install-project
      - name: SBOM and licence gate
        run: |
          uv run cyclonedx-py environment build/runtime-venv --output-reproducible --of JSON -o bundle/sbom.cdx.json
          uv run python -m tools.check_licences --sbom bundle/sbom.cdx.json --mode enforce
      - name: requirements.txt for the target, equal to the SBOM components (U10-87 step 3)
        # uv export is universal: keep the entries whose marker holds on this (target) runner.
        run: |
          mkdir -p build
          uv export --quiet --no-dev --all-extras --no-emit-project --format requirements-txt -o build/requirements.universal.txt
          uv run python - build/requirements.universal.txt bundle/sbom.cdx.json bundle/requirements.txt <<'PY'
          import json, re, sys
          from packaging.markers import Marker
          src, sbom, dest = sys.argv[1:]
          norm = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          blocks = []
          for line in open(src, encoding="utf-8").read().splitlines():
              if line[:1].isspace() and blocks:
                  blocks[-1].append(line)
              else:
                  blocks.append([line])
          kept, pins = [], {}
          for block in blocks:
              head = block[0].split("#", 1)[0].rstrip(" \\")
              req, _, marker = head.partition(";")
              if req.strip() and marker.strip() and not Marker(marker.strip()).evaluate(): continue
              if req.strip():
                  name, _, version = req.strip().partition("==")
                  if norm(name) in pins or not version: sys.exit(f"not pinned once with ==: {name}")
                  pins[norm(name)] = version.strip()
              kept += block
          components = json.load(open(sbom, encoding="utf-8")).get("components", [])
          libs = {norm(c["name"]): c.get("version") for c in components if c.get("type") == "library"}
          diff = sorted(n for n in libs.keys() | pins.keys() if libs.get(n) != pins.get(n))
          if diff: sys.exit("sbom components differ from requirements: " + ", ".join(diff))
          open(dest, "w", encoding="utf-8", newline="\n").write("\n".join(kept) + "\n")
          PY
      - name: download the DuckDB excel extension for windows_amd64 (impl 10 D10-28, U10-86)
        run: |
          duckdb_version=$(sed -n 's/^duckdb==\([^ ;\\]*\).*/\1/p' bundle/requirements.txt)
          [ -n "$duckdb_version" ] || { echo "duckdb is not pinned in requirements.txt" >&2; exit 1; }
          mkdir -p bundle/duckdb
          curl -fsSL -o build/excel.duckdb_extension.gz \
            "https://extensions.duckdb.org/v$duckdb_version/windows_amd64/excel.duckdb_extension.gz"
          gunzip -c build/excel.duckdb_extension.gz > bundle/duckdb/excel.duckdb_extension
      # One attest step per SLSA subject, each followed by a step keeping its bundle-path in DEST.
      - id: provenance-wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2  # pragma: allowlist secret
        with:
          subject-path: bundle/herness-*-py3-none-any.whl
      - name: keep the wheel provenance bundle
        env:
          SUBJECT: bundle/herness-*-py3-none-any.whl
          SRC: ${{ steps.provenance-wheel.outputs.bundle-path }}
          DEST: bundle
          SUFFIX: .provenance.sigstore.json
        run: |
          set -- $SUBJECT; [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "not exactly one file: $SUBJECT" >&2; exit 1; }
          tail -n 1 "$SRC" > "$DEST/${1##*/}$SUFFIX" && rm -f "$SRC"
      - id: provenance-requirements
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2  # pragma: allowlist secret
        with:
          subject-path: bundle/requirements.txt
      - name: keep the requirements.txt provenance bundle
        env:
          SUBJECT: bundle/requirements.txt
          SRC: ${{ steps.provenance-requirements.outputs.bundle-path }}
          DEST: bundle
          SUFFIX: .provenance.sigstore.json
        run: |
          set -- $SUBJECT; [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "not exactly one file: $SUBJECT" >&2; exit 1; }
          tail -n 1 "$SRC" > "$DEST/${1##*/}$SUFFIX" && rm -f "$SRC"
      - id: provenance-excel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2  # pragma: allowlist secret
        with:
          subject-path: bundle/duckdb/excel.duckdb_extension
      - name: keep the excel extension provenance bundle
        env:
          SUBJECT: bundle/duckdb/excel.duckdb_extension
          SRC: ${{ steps.provenance-excel.outputs.bundle-path }}
          DEST: bundle
          SUFFIX: .provenance.sigstore.json
        run: |
          set -- $SUBJECT; [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "not exactly one file: $SUBJECT" >&2; exit 1; }
          tail -n 1 "$SRC" > "$DEST/${1##*/}$SUFFIX" && rm -f "$SRC"
      - id: sbom-wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0  # pragma: allowlist secret
        with:
          subject-path: bundle/herness-*-py3-none-any.whl
          sbom-path: bundle/sbom.cdx.json
      - name: keep the wheel SBOM attestation bundle
        env:
          SUBJECT: bundle/herness-*-py3-none-any.whl
          SRC: ${{ steps.sbom-wheel.outputs.bundle-path }}
          DEST: bundle
          SUFFIX: .sbom.sigstore.json
        run: |
          set -- $SUBJECT; [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "not exactly one file: $SUBJECT" >&2; exit 1; }
          tail -n 1 "$SRC" > "$DEST/${1##*/}$SUFFIX" && rm -f "$SRC"
      # The sdist is a separate release asset (not installed, outside the U10-86 bundle).
      - id: provenance-sdist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2  # pragma: allowlist secret
        with:
          subject-path: sdist/herness-*.tar.gz
      - name: keep the sdist provenance bundle
        env:
          SUBJECT: sdist/herness-*.tar.gz
          SRC: ${{ steps.provenance-sdist.outputs.bundle-path }}
          DEST: sdist
          SUFFIX: .provenance.sigstore.json
        run: |
          set -- $SUBJECT; [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "not exactly one file: $SUBJECT" >&2; exit 1; }
          tail -n 1 "$SRC" > "$DEST/${1##*/}$SUFFIX" && rm -f "$SRC"
      - name: export the Sigstore trusted root (operators compare it with their own copy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > bundle/trusted_root.jsonl
      - name: check the bundle layout (U10-86)
        run: uv run python -c "from pathlib import Path; from herness.admin.attest import ReleaseBundle; ReleaseBundle.load(Path('bundle'))"
      - name: verify every attestation offline against the bundled trusted root (U10-87 flags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          check() {
            gh attestation verify "$1" --bundle "$2" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" --deny-self-hosted-runners \
              --custom-trusted-root bundle/trusted_root.jsonl --predicate-type "$3" --format json > /dev/null
          }
          slsa=https://slsa.dev/provenance/v1
          for f in bundle/herness-*-py3-none-any.whl bundle/requirements.txt sdist/herness-*.tar.gz; do
            check "$f" "$f.provenance.sigstore.json" "$slsa"
          done
          check bundle/duckdb/excel.duckdb_extension bundle/excel.duckdb_extension.provenance.sigstore.json "$slsa"
          check bundle/herness-*-py3-none-any.whl bundle/herness-*-py3-none-any.whl.sbom.sigstore.json https://cyclonedx.org/bom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1  # pragma: allowlist secret
        with:
          name: release
          path: |
            bundle/
            sdist/
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1  # pragma: allowlist secret
        with:
          name: release
          path: .
      - name: generate release notes from the tag annotation
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          obj_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.message' > "$RUNNER_TEMP/tag-notes.md"
      - name: create the GitHub release (bundle zip, sdist and its provenance bundle)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        # A release asset cannot hold duckdb/; the operator extracts the zip into a new empty dir.
        run: |
          ASSET="$RUNNER_TEMP/herness-${TAG#v}-bundle.zip"
          (cd bundle && zip -r -X -D "$ASSET" .)
          gh release create "$TAG" "$ASSET" sdist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/tag-notes.md"
