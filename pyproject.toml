[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "herness"
version = "0.1.0"
description = "Local-first IT operations analytics and agent harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=17",
    "polars>=1.10",
    "numpy",
    "scipy",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml",
    "jsonschema",
    "typer>=0.12",
    "structlog>=24",
    "rich",
    "httpx>=0.27",
    "httpx2>=2.13",
    "tenacity>=9",
    "tzdata",
    "psutil",
    "keyring",
    "pyahocorasick",
    "pymongo>=4.8",
    "snowflake-connector-python[pandas]>=3.12",
    "msal>=1.31",
    "torch",
    "sentence-transformers>=3",
    "scikit-learn>=1.5",
    "lancedb>=0.13",
    "rapidfuzz>=3",
    "openai>=1.50",
    "anthropic>=1,<2",
    "sqlglot",
    "ortools>=9.10",
    "jinja2>=3.1",
    "streamlit>=1.39",
]

[project.optional-dependencies]
ner = ["presidio-analyzer", "spacy"]
pdf = ["weasyprint"]

[project.scripts]
herness = "herness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-benchmark",
    "pytest-timeout",
    "hypothesis",
    "respx",
    "freezegun",
    "mongomock",
    "ruff",
    "mypy",
    "pre-commit",
    "import-linter>=2.1",
    "pip-audit",
    "cyclonedx-bom",
    "detect-secrets",
    "types-PyYAML",
    "types-jsonschema",
    "types-psutil",
]

[tool.uv]
required-version = "==0.11.8"
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.herness.module_budgets]
default = 400

[tool.herness.module_budgets.overrides]
"herness/harness/loop.py" = { limit = 220, reason = "design 05 §5.2" }
# Interim T08-07 / T08-08 stand-ins used by herness.store.ops.core (T02-04); deleted by T08-08.
"herness/store/ops/_shims.py" = { limit = 80, reason = "interim resilience shims (T02-04)" }
# Mirrors the impl 02 §2 row (raised from 260 in T02-04 fix round 1, controller ruling).
"herness/store/ops/core.py" = { limit = 280, reason = "impl 02 §2 module map (T02-04 fix round 1)" }

[tool.herness.licences]
allowed = ["MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "PSF-2.0", "Python-2.0", "ISC", "MPL-2.0"]
approved = [
    { package = "cffi", licence = "MIT-0", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "MIT No Attribution: permissive, fewer conditions than MIT" },
    { package = "numpy", licence = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "all parts permissive; 0BSD, Zlib and CC0-1.0 cover bundled code" },
    { package = "pillow", licence = "MIT-CMU", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "MIT-CMU (HPND family) is a permissive notice licence" },
    { package = "protobuf", licence = "UNKNOWN", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "SBOM carries no licence; PyPI metadata says 3-Clause BSD License" },
    { package = "pyahocorasick", licence = "UNKNOWN", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "SBOM carries no licence; PyPI metadata says BSD-3-Clause and Public-Domain" },
    { package = "pydeck", licence = "UNKNOWN", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "SBOM carries no licence; PyPI metadata says Apache License 2.0" },
    { package = "pyphen", licence = "MPL-1.1", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "tri-licensed GPL-2.0+/LGPL-2.1+/MPL-1.1; MPL-1.1 elected, used unmodified via weasyprint" },
    { package = "regex", licence = "Apache-2.0 AND CNRI-Python", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "CNRI-Python is a permissive licence for code derived from CPython" },
    { package = "transformers", licence = "UNKNOWN", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "SBOM carries no licence; PyPI metadata says Apache 2.0 License" },
    { package = "cuda-toolkit", licence = "UNKNOWN", approved_by = "provisional: T00-14 build (owner sign-off pending, O-03)", approved_on = 2026-09-25, reason = "Linux-only NVIDIA CUDA metapackage without licence metadata; NVIDIA EULA like nvidia-*" },
]
report_only = ["nvidia-*"]  # open item O-03

[tool.herness.licences.aliases]
"MIT License" = "MIT"
"BSD License" = "BSD-3-Clause"
"BSD" = "BSD-3-Clause"
"Apache Software License" = "Apache-2.0"
"Apache 2.0" = "Apache-2.0"
"Apache License 2.0" = "Apache-2.0"
"Apache License, Version 2.0" = "Apache-2.0"
"Python Software Foundation License" = "PSF-2.0"
"ISC License (ISCL)" = "ISC"
"Mozilla Public License 2.0 (MPL 2.0)" = "MPL-2.0"

[tool.hatch.build.targets.wheel]
packages = ["herness"]

[tool.hatch.build.targets.sdist]
include = ["herness", "README.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["herness", "app", "tools", "tests"]
extend-exclude = ["data", "docs", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "PT", "PL", "RUF", "S",
    "DTZ", "TRY", "ASYNC", "PERF", "ANN", "BLE", "EM", "G", "LOG", "T20", "ERA",
    "TID251", "ICN003",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "ANN"]
"herness/core/errors.py" = ["N818"]
"herness/core/logging.py" = ["A005"]
"herness/core/time.py" = ["A005"]
"herness/core/numbers.py" = ["A005"]
"herness/core/types/__init__.py" = ["A005"]
"herness/core/egress.py" = ["TID251"]
"herness/core/egress_clients.py" = ["TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.isort]
known-first-party = ["herness", "app", "tools"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "ENG §3.5: no pickle, marshal or shelve"
"marshal".msg = "ENG §3.5: no pickle, marshal or shelve"
"shelve".msg = "ENG §3.5: no pickle, marshal or shelve"
"yaml.load".msg = "use yaml.safe_load (ENG §3.5)"
