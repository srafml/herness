"httpx2.HTTPTransport".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.AsyncHTTPTransport".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.request".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.stream".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.get".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.post".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.put".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.patch".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.delete".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.head".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.options".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"httpx2.query".msg = "HTTP clients and transports only via herness.core.egress (R-06; loopback model servers via egress.loopback_http_client)"
"datetime.datetime.utcnow".msg = "naive datetime; use herness.core.time"
"datetime.datetime.utcfromtimestamp".msg = "naive datetime; use herness.core.time"

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["herness.core.time"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["herness", "tools"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["app.*", "tools.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# pyarrow ships no type information and the lock has no stubs package.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyahocorasick ships a compiled extension with no type stubs (T10-09).
module = ["ahocorasick"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "unit: no I/O beyond tmp files, no subprocess, no network",
    "integration: real DuckDB, SQLite and LanceDB on tiny or small builds, fakes and stubs",
    "fault: HERNESS_ENV=test, fault plans, subprocess kills",
    "eval: golden or classifier evaluation",
    "gpu: needs vLLM, OpenJev or Laya on CUDA",
    "slow: over 30 s per test, or small or full scale",
]
asyncio_mode = "strict"
timeout = 300
filterwarnings = ["error:::herness"]

[tool.coverage.run]
branch = true
source = ["herness"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "# pragma: gpu"]
show_missing = true

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.xml]
output = "coverage.xml"

[tool.importlinter]
root_packages = ["herness", "tools"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "herness layers"
type = "layers"
layers = [
    "herness.eval | herness.reports",
    "herness.harness",
    "herness.metrics",
    "herness.enrich",
    "herness.connectors | herness.model",
    "herness.store",
    "herness.core",
]
ignore_imports = [
    # settings exception (ENG §2.1, R-03); _config_sections is config.py's private sibling (T10-03b)
    "herness.core.config -> herness.**.settings",
    "herness.core._config_sections -> herness.**.settings",
    # impl 02 §2.2 exception (design 02 §4.1): the build job calls the spec 03 / 04 stage
    # hooks in one process; imported lazily inside the enrich and score stage units only.
    "herness.model._build_stages -> herness.enrich.gpu",
    "herness.model._build_stages -> herness.metrics.facts",
    # impl 01 §2 module map: mapping_check renders staging SQL with T02-11 (render_sql); the
    # render context and lake inventory types come from their own modules (T01-12 report).
    "herness.connectors.mapping_check -> herness.model.sqlfiles",
    "herness.connectors.mapping_check -> herness.model.render_context",
    "herness.connectors.mapping_check -> herness.model.lakeinfo",
]
# The settings exception matches nothing until impl 10 creates herness.core.config.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "herness never imports app or tools"
type = "forbidden"
source_modules = ["herness"]
forbidden_modules = ["tools"]

[[tool.importlinter.contracts]]
name = "core base order"
type = "layers"
layers = [
    "herness.core.logging",
    "herness.core._log_pipeline | herness.core.types",
    "herness.core.ids",
    "herness.core.time | herness.core.numbers",
    "herness.core.errors",
]

[[tool.importlinter.contracts]]
name = "core base is closed"
type = "forbidden"
source_modules = [
    "herness.core.logging",
    "herness.core._log_pipeline",
    "herness.core.types",
    "herness.core.ids",
    "herness.core.time",
    "herness.core.numbers",
    "herness.core.errors",
]
forbidden_modules = [
    "herness.core.audit",
    "herness.core.config",
    "herness.core._config_sections",
    "herness.core.config_checks",
    "herness.core.config_sources",
    "herness.core.config_validate",
    "herness.core.config_view",
    "herness.core.registry",
    "herness.core.redact",
    "herness.core.redact_patterns",
    "herness.core.redact_directory",
    "herness.core.redact_scan",
    "herness.core._redact_pool",
    "herness.core.egress",
    "herness.core.egress_log",
    "herness.core.egress_socket",
    "herness.core._egress_scan",
    "herness.core.egress_clients",
    "herness.core._egress_transport",
    "herness.core._egress_streams",
    "herness.core._egress_source",
    "herness.core.secrets",
    "herness.core.settings",
    "herness.core.resilience",
    "herness.core.jobs",
    "herness.store",
    "herness.model",
    "herness.connectors",
    "herness.eval",
    "herness.metrics",
    "herness.harness",
    "herness.enrich",
    "herness.reports",
]

[[tool.importlinter.contracts]]
name = "types import only errors and ids"
type = "forbidden"
source_modules = ["herness.core.types"]
forbidden_modules = ["herness.core.time", "herness.core.logging", "herness.core._log_pipeline"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# C6 (U00-52, R-03, ENG §2.1): settings modules import only stdlib, pydantic,
# herness.core.types and herness.core.errors from Herness (connector settings modules may also
# import each other); the third-party part (stdlib and pydantic only) is OWN050 in
# check_type_ownership. Forbidden entries that overlap a source are skipped for that source, so
# herness.model stops connectors settings importing herness.model.settings and
# herness.connectors stops the reverse (R-69, D-16).
name = "settings modules are leaves"
type = "forbidden"
source_modules = [
    "herness.core.settings",
    "herness.core.resilience.settings",
    "herness.metrics._weights_settings",
    "herness.metrics.settings",
    "herness.model.settings",
    "herness.connectors.settings",
    "herness.connectors.settings_base",
    "herness.connectors.settings_entities",
    "herness.eval.settings",
    "herness.harness.llm.settings",
    "herness.enrich.settings",
    "herness.reports.settings",
    "herness.harness.memory.settings",
    "herness.harness.pipelines.settings",
]
forbidden_modules = [
    "herness.core.logging",
    "herness.core._log_pipeline",
    "herness.core.ids",
    "herness.core.time",
    "herness.core.numbers",
    "herness.store",
    "herness.model",
    "herness.model.errors",
    "herness.metrics._binds",
    "herness.metrics._catalog_checks",
    "herness.metrics._encode",
    "herness.metrics._encode_nested",
    "herness.metrics._recorded",
    "herness.metrics.catalog",
    "herness.metrics.evidence",
    "herness.metrics.facts",
    "herness.metrics.render",
    "herness.metrics.windows",
    "herness.connectors",
]
# settings reach core.ids and core.time only through core.types (R-03 restricts direct imports)
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "model-settings-light"
type = "forbidden"
# impl 02 §2.2: herness.model.settings imports only stdlib, pydantic, herness.core.types and
# herness.core.errors (R-03); the third-party part is checked by tools.check_type_ownership.
source_modules = ["herness.model.settings"]
forbidden_modules = [
    "herness.core.logging",
    "herness.core._log_pipeline",
    "herness.core.ids",
    "herness.core.time",
    "herness.core.numbers",
    "herness.store",
    "herness.model.errors",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "enrich-settings-light"
type = "forbidden"
# impl 03 §2: herness.enrich.settings imports only stdlib, pydantic, herness.core.types and
# herness.core.errors (R-03); the third-party part is checked by tools.check_type_ownership.
source_modules = ["herness.enrich.settings"]
forbidden_modules = [
    "herness.core.logging",
    "herness.core._log_pipeline",
    "herness.core.ids",
    "herness.core.time",
    "herness.core.numbers",
    "herness.store",
    "herness.model",
    "herness.connectors",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "store-no-upward"
type = "forbidden"
# impl 02 §2.2: herness.store imports nothing from L2 and above; later cards append packages.
source_modules = ["herness.store"]
forbidden_modules = ["herness.model", "herness.harness", "herness.enrich"]
# settings exception (ENG §2.1, R-03): store may reach herness.core.config, which types its
# root model with the owners' settings modules (T10-03).
ignore_imports = [
    "herness.core.config -> herness.**.settings",
    "herness.core._config_sections -> herness.**.settings",
]

[[tool.importlinter.contracts]]
name = "ops-areas-acyclic"
type = "forbidden"
# impl 02 §2.2, §2.3 rule 5: an ops area module imports from the ops package only
# herness.store.ops.core; it never imports another area or the package herness.store.ops.
# Only herness/store/ops/__init__.py imports the areas. `_shims` holds the interim T08-07 /
# T08-08 stand-ins that core calls; the wildcards pick up each area as its card adds it.
source_modules = ["herness.store.ops.*"]
forbidden_modules = ["herness.store.ops", "herness.store.ops.*"]
as_packages = false
ignore_imports = [
    "herness.store.ops.* -> herness.store.ops.core",
    "herness.store.ops.core -> herness.store.ops._shims",
    # T07-03: private sibling of area `memory` (row types, SQL plumbing), kept apart for the
    # impl 07 §2 line budget of memory.py; no other module imports it.
    "herness.store.ops.memory -> herness.store.ops._memory_rows",
    # T07-04: private sibling of area `closed_loop` (row types, constant SQL, plumbing), kept
    # apart for the impl 07 §2 line budget of closed_loop.py; no other module imports it.
    "herness.store.ops.closed_loop -> herness.store.ops._closed_loop_rows",
    "herness.store.ops.shared -> herness.store.ops._review_common",
    # impl 08 U08-94 / R-12: SqliteResilienceBackend.insert_metric_samples delegates to the
    # single metric_sample writer; metrics imports only core, so the graph stays acyclic.
    "herness.store.ops.resilience -> herness.store.ops.metrics",
    # impl 08 U08-96 / T08-11: SqliteJobsBackend inherits WorkerSqlMixin; worker imports only
    # core, so the graph stays acyclic.
    "herness.store.ops.jobs -> herness.store.ops.worker",
    # impl 08 U08-97 / T08-16: SqliteJobsBackend inherits TaskSqlMixin; tasks imports only core
    # (and herness.core.jobs), so the graph stays acyclic.
    "herness.store.ops.jobs -> herness.store.ops.tasks",
    # T08-11: private sibling of area `jobs` (constant SQL), kept apart for the impl 08 §2 line
    # budget of jobs.py; no other module imports it.
    "herness.store.ops.jobs -> herness.store.ops._job_sql",
]
# The area -> core ignore matches `migrate` (T02-05), `shared` (T02-07) and each area its card
# adds later.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "herness.core must not import herness.store or herness.harness"
type = "forbidden"
# R-04: L0 reaches the ops store and the harness only through ports bound at the composition
# root (UT00-58 lists existing modules only).
source_modules = ["herness.core"]
forbidden_modules = ["herness.store", "herness.harness"]
# settings exception (ENG §2.1, R-03): herness.core.config types its root model with
# herness.harness.llm.settings (T10-03).
ignore_imports = [
    "herness.core.config -> herness.**.settings",
    "herness.core._config_sections -> herness.**.settings",
]

[[tool.importlinter.contracts]]
name = "resilience-settings-light"
type = "forbidden"
# impl 08 §2 / R-03: herness.core.resilience.settings imports only stdlib, pydantic,
# herness.core.types and herness.core.errors (third-party part checked by
# tools.check_type_ownership). The wildcard matches that module once T08-26 creates it.
source_modules = ["herness.core.*.settings"]
forbidden_modules = [
    "herness.core.logging",
    "herness.core._log_pipeline",
    "herness.core.ids",
    "herness.core.time",
    "herness.core.numbers",
    "herness.core.jobs",
    "herness.store",
    "herness.model",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "store-rw-restricted"
type = "forbidden"
# impl 02 §2.2, TH02-05 (ST02-05): herness.store._warehouse_rw may be imported only by
# herness.model.build (T02-18) and herness.model.promote (a later card); neither module
# exists yet on this tree, so the ignore_imports lines below match nothing for now.
source_modules = ["herness"]
forbidden_modules = ["herness.store._warehouse_rw"]
ignore_imports = [
    "herness.model.build -> herness.store._warehouse_rw",
    "herness.model.promote -> herness.store._warehouse_rw",
]
unmatched_ignore_imports_alerting = "none"
