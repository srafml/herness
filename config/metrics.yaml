# Metric catalog (design 04 §4.1, §7.1; impl 04 U04-16…U04-18, U04-48). Sensitivity: internal.
version: 1
defaults:
  min_sample_size: 10
  windows: {week: 26, month: 24, quarter: 8}
  exclude_incident_states: [canceled]
  exclude_close_codes: ["Duplicate", "Cancelled", "Not an incident"]
  max_resolve_days: 365            # durations above this are excluded (data errors)
  cluster_min_membership: 0.5
  change_link_min_score: 0.7
  repeat_window_days: 30
  noise_severities: [critical, major, minor, warning]   # info excluded from noise ratio
  failure_outcomes: [unsuccessful, backed_out]
  compute_timeout_s: 30.0          # interactive compute timeout (DD04-06)
# The 28 catalog entries (U04-48, tables A and B), in table order. T04-08 ships #1-#4;
# T04-09 adds #5-#14, T04-10 #15-#19, #27 and #28, and T04-11 #20-#26.
metrics:
  - name: incident_count
    description: Count of non-excluded incidents opened in the period.
    domain: ops
    grains: [service, team, org, cluster]
    unit: count
    better: lower
    aggregation: count
    min_sample_size: 1
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: null
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.opened_at') }} AS period_start,
             count(*) AS value, count(*) AS numerator, NULL AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.opened_at >= {{ p('window_start') }} AND f.opened_at < {{ p('window_end') }}
        AND NOT f.excluded
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: p1p2_count
    description: Count of non-excluded priority 1 and 2 incidents opened in the period.
    domain: ops
    grains: [service, team, org, cluster]
    unit: count
    better: lower
    aggregation: count
    min_sample_size: 1
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: null
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.opened_at') }} AS period_start,
             count(*) AS value, count(*) AS numerator, NULL AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.opened_at >= {{ p('window_start') }} AND f.opened_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.priority <= 2
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: mttr_hours
    description: Mean wall-clock hours from opened_at to resolved_at of resolved incidents.
    domain: ops
    grains: [service, team, org, cluster]
    unit: hours
    better: lower
    aggregation: mean
    min_sample_size: 10
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: mttr
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.resolved_at') }} AS period_start,
             avg(f.resolve_h) AS value, sum(f.resolve_h) AS numerator,
             count(f.resolve_h) AS denominator, count(f.resolve_h) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.resolved_at >= {{ p('window_start') }} AND f.resolved_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.resolve_h IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: mttr_p50_hours
    description: Median wall-clock hours from opened_at to resolved_at of resolved incidents.
    domain: ops
    grains: [service, team, org, cluster]
    unit: hours
    better: lower
    aggregation: median
    min_sample_size: 10
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: mttr
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.resolved_at') }} AS period_start,
             median(f.resolve_h) AS value, NULL AS numerator,
             count(f.resolve_h) AS denominator, count(f.resolve_h) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.resolved_at >= {{ p('window_start') }} AND f.resolved_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.resolve_h IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: mttr_business_hours
    description: Mean source business hours to resolve of resolved incidents (NULLs dropped).
    domain: ops
    grains: [service, team, org, cluster]
    unit: hours
    better: lower
    aggregation: mean
    min_sample_size: 10
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: mttr
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.resolved_at') }} AS period_start,
             avg(f.resolve_bh) AS value, sum(f.resolve_bh) AS numerator,
             count(f.resolve_bh) AS denominator, count(f.resolve_bh) AS sample_size,
             count(f.resolve_bh) / count(*) AS coverage
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.resolved_at >= {{ p('window_start') }} AND f.resolved_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.resolve_h IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: mtta_minutes
    description: Mean minutes from opened_at to acknowledged_at of non-excluded incidents.
    domain: ops
    grains: [service, team, org]
    unit: minutes
    better: lower
    aggregation: mean
    min_sample_size: 10
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: null
    filters: [priority, service_id, team_id, org_id]
    enabled: true
    requires_columns: [core.incident.acknowledged_at]
    sql: |
      {%- set ACK = "CASE WHEN i.acknowledged_at >= f.opened_at THEN date_diff('second', f.opened_at, i.acknowledged_at) / 60.0 END" %}
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.opened_at') }} AS period_start,
             avg({{ ACK }}) AS value, sum({{ ACK }}) AS numerator,
             count({{ ACK }}) AS denominator, count({{ ACK }}) AS sample_size,
             count({{ ACK }}) / count(*) AS coverage
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      JOIN core.incident i ON i.record_id = f.record_id
      WHERE f.opened_at >= {{ p('window_start') }} AND f.opened_at < {{ p('window_end') }}
        AND NOT f.excluded
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: customer_impact_minutes
    description: Sum of customer impact minutes of non-excluded incidents opened in the period.
    domain: ops
    grains: [service, team, org, cluster]
    unit: minutes
    better: lower
    aggregation: sum
    min_sample_size: 1
    owner: sre-analytics
    estimate: false
    uses_weights: [impact_fallback]
    usd_model: null
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.opened_at') }} AS period_start,
             sum(f.impact_h * 60) AS value, sum(f.impact_h * 60) AS numerator,
             NULL AS denominator, count(*) AS sample_size,
             count(*) FILTER (WHERE f.impact_estimated) AS estimated_count
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.opened_at >= {{ p('window_start') }} AND f.opened_at < {{ p('window_end') }}
        AND NOT f.excluded
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: repeat_incident_rate
    description: Share of non-excluded incidents with a service that repeat a recent incident.
    domain: ops
    grains: [service, team, org, cluster]
    unit: ratio
    better: lower
    aggregation: ratio
    min_sample_size: 20
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: repeat
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.opened_at') }} AS period_start,
             count(*) FILTER (WHERE f.is_repeat) / count(*) AS value,
             count(*) FILTER (WHERE f.is_repeat) AS numerator, count(*) AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.opened_at >= {{ p('window_start') }} AND f.opened_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.service_id IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: reopen_rate
    description: Share of resolved incidents that were reopened at least once.
    domain: ops
    grains: [service, team, org, cluster]
    unit: ratio
    better: lower
    aggregation: ratio
    min_sample_size: 20
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: reopen
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.resolved_at') }} AS period_start,
             count(*) FILTER (WHERE f.is_reopened) / count(*) AS value,
             count(*) FILTER (WHERE f.is_reopened) AS numerator, count(*) AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.resolved_at >= {{ p('window_start') }} AND f.resolved_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.resolve_h IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: reassignment_rate
    description: Share of resolved incidents that were reassigned at least once.
    domain: ops
    grains: [service, team, org, cluster]
    unit: ratio
    better: lower
    aggregation: ratio
    min_sample_size: 20
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: reassign
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.resolved_at') }} AS period_start,
             count(*) FILTER (WHERE f.is_reassigned) / count(*) AS value,
             count(*) FILTER (WHERE f.is_reassigned) AS numerator, count(*) AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.resolved_at >= {{ p('window_start') }} AND f.resolved_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.resolve_h IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: sla_breach_rate
    description: Share of resolved incidents with a known SLA outcome that breached the SLA.
    domain: ops
    grains: [service, team, org, cluster]
    unit: ratio
    better: lower
    aggregation: ratio
    min_sample_size: 20
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: sla
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.resolved_at') }} AS period_start,
             count(*) FILTER (WHERE f.sla_breached) / count(*) AS value,
             count(*) FILTER (WHERE f.sla_breached) AS numerator, count(*) AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.resolved_at >= {{ p('window_start') }} AND f.resolved_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.resolve_h IS NOT NULL AND f.sla_breached IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: alert_noise_ratio
    description: Share of noise-severity events that are not linked to an incident.
    domain: monitoring
    grains: [service, team, org]
    unit: ratio
    better: lower
    aggregation: ratio
    min_sample_size: 50
    owner: sre-analytics
    estimate: false
    uses_weights: []
    usd_model: noise
    filters: [service_id, team_id, org_id, severity]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('event', 'e') }} AS entity_id,
             {{ period_start('e.ts') }} AS period_start,
             count(*) FILTER (WHERE e.incident_id IS NULL) / count(*) AS value,
             count(*) FILTER (WHERE e.incident_id IS NULL) AS numerator,
             count(*) AS denominator, count(*) AS sample_size
      FROM core.event e {{ entity_join('event', 'e') }}
      WHERE e.ts >= {{ p('window_start') }} AND e.ts < {{ p('window_end') }}
        AND list_contains({{ p('d_noise_severities') }}, e.severity)
        {{ filter_clause('event', 'e') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: toil_hours_est
    description: Estimated engineer toil hours of resolved incidents (design 04 §5.3).
    domain: ops
    grains: [service, team, org, cluster]
    unit: hours
    better: lower
    aggregation: sum
    min_sample_size: 1
    owner: sre-analytics
    estimate: true
    uses_weights: [toil]
    usd_model: null
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.resolved_at') }} AS period_start,
             sum(f.toil_h) AS value, sum(f.toil_h) AS numerator, NULL AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.resolved_at >= {{ p('window_start') }} AND f.resolved_at < {{ p('window_end') }}
        AND NOT f.excluded AND f.resolve_h IS NOT NULL
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
  - name: incident_cost_usd
    description: Estimated downtime and toil cost in USD of non-excluded incidents (§5.3).
    domain: cost
    grains: [service, team, org, cluster]
    unit: usd
    better: lower
    aggregation: sum
    min_sample_size: 1
    owner: sre-analytics
    estimate: true
    uses_weights: [cost_per_downtime_hour, priority_impact_multiplier, impact_fallback, toil, cost_per_engineer_hour]
    usd_model: null
    filters: [priority, service_id, team_id, org_id, cluster_id]
    enabled: true
    requires_columns: []
    sql: |
      SELECT {{ entity_col('incident', 'f') }} AS entity_id,
             {{ period_start('f.opened_at') }} AS period_start,
             CAST(sum(f.total_usd) AS DOUBLE) AS value,
             CAST(sum(f.total_usd) AS DOUBLE) AS numerator, NULL AS denominator,
             count(*) AS sample_size
      FROM metrics.incident_fact f {{ entity_join('incident', 'f') }}
      WHERE f.opened_at >= {{ p('window_start') }} AND f.opened_at < {{ p('window_end') }}
        AND NOT f.excluded
        {{ filter_clause('incident', 'f') }} {{ entity_filter() }}
      GROUP BY ALL
scoring:
  as_of: null                     # null = build date in business_timezone
  funding:
    tier_weights: {cluster_weight: 0.8, root_cause_weight: 0.6, service_weight: 0.3}
    min_direct_links: 1
    window_days: 365
  org:
    min_peer_group: 5
    trend_weight: 0.5
    min_weight_coverage: 0.5
    # T04-10/11: restore the remaining design 04 §7.1 scorecard weights as each metric ships:
    #   change_failure_rate 0.15 (T04-10); cycle_time_days 0.10, unplanned_work_ratio 0.10,
    #   epic_predictability 0.05 (T04-11). U04-26 step 8 rejects names absent from the catalog.
    metrics: {mttr_hours: 0.15, repeat_incident_rate: 0.15, sla_breach_rate: 0.10,
              reopen_rate: 0.05, reassignment_rate: 0.05, alert_noise_ratio: 0.10}
  peer_group:
    min_service_peers: 3          # below this, service/work_item peer_group() returns fallback "prior_year"
  levers:
    top_entities: 50
    templates:
      mttr: "Moving {metric_label} for {entity_name} from {current_value} to the {target_kind} of {target_value} {unit} is worth about {delta_usd} per year, based on {n_basis} records in the last 12 months."
      repeat: "Moving {metric_label} for {entity_name} from {current_value} to the {target_kind} of {target_value} {unit} is worth about {delta_usd} per year, based on {n_basis} records in the last 12 months."
      reopen: "Moving {metric_label} for {entity_name} from {current_value} to the {target_kind} of {target_value} {unit} is worth about {delta_usd} per year, based on {n_basis} records in the last 12 months."
      reassign: "Moving {metric_label} for {entity_name} from {current_value} to the {target_kind} of {target_value} {unit} is worth about {delta_usd} per year, based on {n_basis} records in the last 12 months."
      sla: "Moving {metric_label} for {entity_name} from {current_value} to the {target_kind} of {target_value} {unit} is worth about {delta_usd} per year, based on {n_basis} records in the last 12 months."
      cfr: "Moving {metric_label} for {entity_name} from {current_value} to the {target_kind} of {target_value} {unit} is worth about {delta_usd} per year, based on {n_basis} records in the last 12 months."
      noise: "Moving {metric_label} for {entity_name} from {current_value} to the {target_kind} of {target_value} {unit} is worth about {delta_usd} per year, based on {n_basis} records in the last 12 months."
