# Model clients, routing and harness settings (impl 05 U05-72, design 05 §7).
# Sections `models` and `harness` are validated by herness.harness.llm.settings.ModelsConfig.
# The sibling top-level `deciders` section is owned by impl 03 (R-76); validated by
# herness.enrich.settings.DecidersSettings (keys and defaults: docs/impl/03-enrichment.impl.md §9).
# Credentials are `secret:` references only (TH05-15).
models:
  clients:
    local-30b:
      kind: openai_compat
      base_url: "http://127.0.0.1:8000/v1"   # vLLM (R-51)
      api_key: "secret:vllm.api_key"
      model: "local-30b"                     # vLLM --served-model-name; weights pinned in spec 10 deploy
      context_window: 32768                  # <= server max_model_len (R-52)
      max_effective_context: null            # null = context_window; caps the compaction budget (spec 07 §5)
      max_output_tokens: 4096
      tokenizer: vllm_endpoint               # vllm_endpoint | estimate | anthropic
      max_concurrency: 6                     # spec 06 call gate size
      chat_reserved_slots: 2                 # spec 08 §5.10; enforced by the spec 06 gate
      reasoning_parser: qwen3
      supports: {tools: true, json_schema: true, thinking_toggle: true, seed: true}
      timeout_s: 300
      off_network: false
      gpu_class: reasoning
      price_per_mtok: {input: "0", output: "0", cache_read: "0", cache_write: "0"}
    local-lora-14b:      {kind: openai_compat, base_url: "http://127.0.0.1:8000/v1", model: "local-lora-14b",
                          context_window: 32768, max_output_tokens: 4096, tokenizer: vllm_endpoint,
                          max_concurrency: 6, gpu_class: reasoning, off_network: false,
                          price_per_mtok: {input: "0", output: "0", cache_read: "0", cache_write: "0"}}
    local-large-offload: {kind: openai_compat, base_url: "http://127.0.0.1:8200/v1", model: "local-large",
                          context_window: 32768, max_output_tokens: 4096, tokenizer: estimate,
                          max_concurrency: 1, gpu_class: large, timeout_s: 3600, off_network: false,
                          price_per_mtok: {input: "0", output: "0", cache_read: "0", cache_write: "0"}}
    local-small-cpu:     {kind: openai_compat, base_url: "http://127.0.0.1:11434/v1", model: "small-cpu-model",
                          context_window: 16384, max_output_tokens: 2048, tokenizer: estimate,
                          max_concurrency: 2, gpu_class: null, off_network: false,
                          price_per_mtok: {input: "0", output: "0", cache_read: "0", cache_write: "0"}}
    # spec 11 eval.yaml judge; pin a model family other than local-30b's (self-preference)
    local-judge:         {kind: openai_compat, base_url: "http://127.0.0.1:11434/v1", model: "judge-model",
                          context_window: 16384, max_output_tokens: 2048, tokenizer: estimate,
                          max_concurrency: 1, gpu_class: null, off_network: false,
                          price_per_mtok: {input: "0", output: "0", cache_read: "0", cache_write: "0"}}
    claude-opus:
      kind: anthropic
      api_key: "secret:anthropic.api_key"
      model: claude-opus-5-5
      context_window: 1000000
      max_effective_context: 200000          # cost and latency cap
      max_output_tokens: 16000
      tokenizer: anthropic
      max_concurrency: 50
      thinking_mode: adaptive_always         # adaptive_always | adaptive_optional | budget
      supports: {tools: true, json_schema: true, effort: true, sampling_params: false, batch: true}
      timeout_s: 600
      off_network: true
      gpu_class: null
      price_per_mtok: {input: "4.00", output: "20.00", cache_read: "0.20", cache_write: "5.00"}
    claude-sonnet: {kind: anthropic, api_key: "secret:anthropic.api_key", model: claude-sonnet-5,
                    context_window: 1000000, max_effective_context: 200000, max_output_tokens: 16000,
                    tokenizer: anthropic, max_concurrency: 50, thinking_mode: adaptive_optional,
                    supports: {tools: true, json_schema: true, effort: true, sampling_params: false, batch: true},
                    timeout_s: 600, off_network: true,
                    price_per_mtok: {input: "2.00", output: "10.00", cache_read: "0.20", cache_write: "2.50"}}
    claude-haiku:  {kind: anthropic, api_key: "secret:anthropic.api_key", model: claude-haiku-4-5,
                    context_window: 200000, max_effective_context: null, max_output_tokens: 8000,
                    tokenizer: anthropic, max_concurrency: 50, thinking_mode: budget,
                    supports: {tools: true, json_schema: true, batch: true},
                    timeout_s: 600, off_network: true,
                    price_per_mtok: {input: "1.00", output: "5.00", cache_read: "0.10", cache_write: "1.25"}}
  roles:                                     # model role -> client key (local profile)
    planner: local-30b
    judge: local-30b
    analyst: local-30b
    skeptic: local-30b
    skeptic_final: local-30b
    writer: local-30b
    chat: local-30b
    chat_off_hours: local-small-cpu
    triage: local-30b
    enrich_decider: local-30b                # spec 03; runs in GPU class reasoning
    cluster_namer: local-30b                 # spec 03
  fallback:                                  # per model role; first entry must equal roles.<role>; spec 08 executes
    planner:        [local-30b, local-large-offload, claude-opus]
    judge:          [local-30b]
    analyst:        [local-30b, claude-opus]
    skeptic:        [local-30b, local-large-offload, claude-opus]
    skeptic_final:  [local-30b, local-large-offload, claude-opus]
    writer:         [local-30b, local-large-offload, claude-opus]
    chat:           [local-30b, claude-opus]
    chat_off_hours: [local-small-cpu]
    triage:         [local-30b]
    enrich_decider: [local-30b]
    cluster_namer:  [local-30b]
  depth_overrides:
    fast:     {}
    standard: {}
    deep:     {roles: {skeptic_final: local-large-offload, writer: local-large-offload}}   # local profile only
  role_params:                               # defaults of design §5.5; thinking auto per §5.1.1
    planner:  {temperature: 0.2, effort: high,   thinking: auto}
    judge:    {temperature: 0.0, effort: medium, thinking: "off"}
    analyst:  {temperature: 0.2, effort: medium, thinking: auto}
    skeptic:  {temperature: 0.5, effort: high,   thinking: auto}
    writer:   {temperature: 0.4, effort: high,   thinking: auto}
    chat:     {temperature: 0.3, effort: medium, thinking: auto}
    enrich_decider: {temperature: 0.7, effort: low, thinking: "off"}   # spec 03 may override temperature per call
    cluster_namer:  {temperature: 0.2, effort: low, thinking: "off"}
  anthropic: {server_side_fallback: false, cache_ttl: 5m}
  depth: {default: standard}
harness:
  tools: {max_parallel: 4}
  sql:
    return_rows: 200
    scan_rows: 1000000
    timeout_s: {fast: 15, standard: 30, deep: 120}
    threads: 4
    memory_limit: "8GB"
    blocked_columns:                         # design §5.4.3
      - core.incident.short_description
      - core.incident.description
      - core.incident.close_notes
      - core.change.short_description
      - core.change.description
      - core.problem.root_cause_text
      - core.work_item.description
  loop: {wrap_up_ratio: 0.9, no_progress_steps: 4, error_streak: 3}   # compaction thresholds: spec 07 memory.yaml (soft_ratio 0.70)
  verifier: {float_rel_tol: 0.005, rerun_timeout_s: 60}
  trace: {payload_sample_rate: {eval: 1.0, chat: 0.0, review: 0.1}, max_payload_chars: 20000}

deciders:
  laya:
    current_file: data/models/laya/CURRENT
    device: cuda
    dtype: bf16
    fast: false            # true only after the parity test IT03-16 passed
    call_batch: 256
    batch_size: 64
  openjev:
    enabled: true
    base_url: "http://127.0.0.1:8100"   # host port (container port 8080, R-51); loopback only
    model: openjev-latest
    concurrency: 64
    timeout_s: 30
    samples: {fast: 1, standard: null, deep: 5}
    api_key: "secret:OPENJEV_API_KEY"   # R-53
  jev:
    enabled: false         # hosted Jev; the profile must allow egress (spec 10)
    base_url: "https://api.typesafe.ai"
    model: jev-latest
    concurrency: 16
    api_key: "secret:TYPESAFE_API_KEY"
  llm:
    role: enrich_decider
    votes: {fast: 1, standard: 3, deep: 5}
    temperature: 0.7
