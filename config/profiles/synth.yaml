# Synth profile overlay (design 10 §4.3, design 11 §5.1.2, U10-94): synthetic-data testing and
# development. Never enables egress (U10-17 enforces this at load time) and never sets
# security.data_policy (TH10-03). Role -> model, deciders and pipelines swarm caps stay as
# `local` (no overrides here).
version: 1
security:
  secrets:
    backend: dotenv         # allowed only in dev/synth (C12); Phase 1 uses a fixed test HMAC key
  redaction:
    denylist_domains: []    # O-8 open: corporate domains supplied at Phase 1; empty until then

# T11-16: the generator's lake as sources (design 11 §5.1.2, U11-27). Read from the synthetic
# lake, never fetched: every section stays disabled, so no host joins the socket allowlist.
# `fields` are the generated columns plus `incident_state`/`problem_state` (the staging SQL
# coalesces them with `state`; the lake has `state` only); IT11-03 keeps them in step with the generator.
sources:
  version: 1
  sources:
    servicenow:
      enabled: false
      base_url: http://127.0.0.1:8080
      auth: {method: oauth_client_credentials, credentials: "secret:sn_oauth"}  # pragma: allowlist secret
      entities:
        change_request:
          fields: [sys_id, sys_updated_on, number, type, state, risk, opened_at, start_date, end_date, work_start, work_end, business_service, cmdb_ci, assignment_group, close_code, short_description, description]
        cmdb_ci:
          fields: [sys_id, sys_updated_on, sys_class_name, name, owned_by, support_group, cost_center, company]
          classes: [cmdb_ci_server]
        cmdb_ci_service:
          fields: [sys_id, sys_updated_on, name, sys_class_name, owned_by, support_group, cost_center, company, busines_criticality]
        cmdb_rel_ci:
          fields: [sys_id, sys_updated_on, parent, child, type]
        cmn_department:
          fields: [sys_id, sys_updated_on, name, parent, cost_center]
        incident:
          fields: [incident_state, sys_id, sys_updated_on, number, opened_at, u_acknowledged_at, resolved_at, closed_at, priority, state, business_service, cmdb_ci, assignment_group, reassignment_count, reopen_count, short_description, description, close_notes, close_code, problem_id, caused_by, made_sla, business_duration, u_customer_impact_minutes]
        problem:
          fields: [problem_state, sys_id, sys_updated_on, number, opened_at, resolved_at, state, business_service, assignment_group, known_error, cause_notes]
        sys_user_group:
          fields: [sys_id, sys_updated_on, name, parent, manager, cost_center, active, type]
        task_sla:
          fields: [sys_id, sys_updated_on, task, sla, stage, has_breached]
    jira:
      enabled: false
      flavor: cloud
      base_url: http://127.0.0.1:8081
      auth: {method: api_token, credentials: "secret:jira_token"}  # pragma: allowlist secret
    files:
      enabled: false
      entities:
        service_costs: {pattern: "*.csv", key_field: [service_name], mode: snapshot}
