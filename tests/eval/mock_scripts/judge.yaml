- match: {model_role: eval_judge, dedup_key: G15}
  turns:
    - final:
        output:
          scores: {states_the_seasonal_driver: 4, separates_volume_from_performance: 4}
          rationale: "Names the seasonal driver and keeps volume apart from performance."
- match: {model_role: eval_judge, dedup_key: F05}
  turns:
