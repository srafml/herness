# T05-28 (ET05-01): incidents summed over the monthly rollup. Three tool calls.
- match: {dedup_key: "*"}
  turns:
    - tool_calls:
        - name: list_tables
          arguments: {schema: metrics}
    - tool_calls:
        - name: describe_table
          arguments: {table: metrics.incident_monthly}
    - tool_calls:
        - name: run_sql
          arguments:
            sql: "SELECT sum(incidents) AS incidents FROM metrics.incident_monthly"
            purpose: incidents over the monthly rollup
    - final:
        text: "The monthly rollup sums to [[n1]] incidents."
    - final:
        output:
          text: "The monthly rollup sums to [[n1]] incidents."
          numbers_from: last_tool_result
