# T11-34 (U11-48): the stub LLM of the fixture build serves cluster naming only. The stub HTTP
# server sees no role or dedup headers, so every call is one stream: the first call is the
# `vllm-reasoning` warm-up, the next ones name clusters (one fixed label, category `unknown`),
# 200 turns in all; clusters past that keep their `auto:` label (naming_fallback). LLM
# escalation is off in the build (`decisions.escalation.llm_max_rows_per_night=0`).
